[package]
name = "file-transfer-desktop"
version = "0.2.0"
description = "Pannello di controllo per il server File Transfer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2.8.1"

[[bin]]
name = "file-transfer-desktop"
path = "src/main.rs"
